<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIMZO COLLECTION - Tekis</title>
<link rel="stylesheet" href="style/style.css">
</head>
<body>
<header>
  <div class="logo">TIMZO<span>COLLECTION</span></div>
  <div class="cart" onclick="openCart()">🛒 <span id="cartCount">0</span></div>
</header>

<section class="hero">
  <h1>TEKIS. DRIP. FOR LESS.</h1>
  <p>Authentic Tekis • Durban • Delivery Nationwide</p>
</section>

<div class="products" id="products"></div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeModal('productModal')">×</span>
    <img id="mImage" class="m-img">
    <h3 id="mName"></h3>
    <p id="mPrice"></p>
    <p id="mStockInfo" class="small"></p>

    <label>Size *</label>
    <select id="mSize"></select>

    <label>Quantity *</label>
    <input type="number" id="mQty" min="1" value="1">

    <p id="mError" class="error"></p>
    <button class="btn" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<!-- CART + FORM -->
<div id="cartModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeModal('cartModal')">×</span>
    <h3>Your Order</h3>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
    <hr>
    <form onsubmit="submitOrder(event)">
      <label>Name *</label><input id="custName" required placeholder="Your name">
      <label>WhatsApp *</label><input id="custPhone" required placeholder="07...">
      <label>Delivery *</label>
      <select id="custCampus" required>
        <option value="">Select...</option>
        <option>Around Durban</option>
        <option>Outside Durban - PAXI / Courier</option>
      </select>
      <label>Address / Room</label><input id="custAddress" placeholder="Exact location">
      <button class="btn primary">Order via WhatsApp</button>
    </form>
  </div>
</div>

<footer>
  <div>TIMZO COLLECTION • Tekis & Sneakers • Durban</div>
  <div class="teo">
    <img src="images/logo.jpeg" class="teo-logo">
    <span>Website by <a href="PLACEHOLDER_PORTFOLIO_LINK" target="_blank">TeoCode</a> — Want this for your brand?</span>
  </div>
</footer>

<script src="script/script.js"></script>
</body>
</html>
